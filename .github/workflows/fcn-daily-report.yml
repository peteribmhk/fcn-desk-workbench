name: FCN Daily Screen

on:
  workflow_dispatch:
  schedule:
    # ~08:30 Hong Kong time, Monday-Friday (after the US close). GitHub cron uses UTC.
    - cron: "30 0 * * 1-5"

permissions:
  contents: write

concurrency:
  group: fcn-daily
  cancel-in-progress: false

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run FCN daily screen
        run: python scripts/generate_daily_pickings.py

      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add daily
          if git diff --cached --quiet; then
            echo "No report changes to commit."
          else
            git commit -m "Daily FCN screen $(TZ=Asia/Hong_Kong date +%Y-%m-%d)"
            git pull --rebase
            git push
          fi
